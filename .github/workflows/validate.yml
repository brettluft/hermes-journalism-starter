name: Validate starter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scaffold tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m py_compile skills/newsroom-setup/scripts/newsroom_config.py
      - name: Validate shell syntax
        run: bash -n docker/cont-init.d/00-journalism-bootstrap
      - name: Build container
        run: docker build --tag hermes-journalism-starter:test .
