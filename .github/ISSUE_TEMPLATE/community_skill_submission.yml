name: Community Skill Submission
description: Submit a custom investigative or newsroom skill to be bundled upstream in the starter.
title: "Add Community Skill: [Skill Name]"
labels: ["community-skill", "skill-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a journalism skill to Hermes Agent! Please ensure all private newsroom keys, internal URLs, and credentials have been removed.
  - type: input
    id: skill_name
    attributes:
      label: Skill Name
      description: The directory name of the skill (e.g., state-foia-tracker, sec-form-4).
      placeholder: foia-tracker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Skill Description
      description: What beats, record types, or investigative workflows does this skill support?
    validations:
      required: true
  - type: textarea
    id: skill_content
    attributes:
      label: Packaged Skill Content
      description: Paste the packaged markdown generated by `package_skill.py` or provide the full SKILL.md and scripts.
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Verification Checklist
      options:
        - label: I confirm this skill contains no private API keys, passwords, or newsroom secrets.
          required: true
        - label: I agree to license this contribution under the repository's open-source license (MIT).
          required: true
